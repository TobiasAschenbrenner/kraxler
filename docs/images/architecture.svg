<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title description">
  <title id="title">Kraxler application architecture</title>
  <desc id="description">The native SwiftUI iPhone app communicates with the Express and TypeScript API on Hostinger over HTTPS. MongoDB Atlas stores areas, routes, saved and ticked route records, and user profiles. Firebase Authentication supports email/password, Google and Apple login. Protected requests carry a Firebase ID token, which Firebase Admin verifies using cached public signing keys. The app loads topo images and custom profile photos directly from Cloudinary; authenticated custom profile photo uploads and deletion go through the backend. Mapbox provides maps and downloaded map tiles. SwiftData stores downloaded climbing content, UserDefaults stores preferences, and Firebase persists authentication through the iOS Keychain. GitHub main pushes automatically deploy the backend, not the iPhone app.</desc>
